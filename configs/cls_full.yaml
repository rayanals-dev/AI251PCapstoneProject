# Track 1, M4: ResNet18 ImageNet, full fine-tune (selected model).
# Exported from checkpoint 2026-10-23_cls-full-64-s42-lr0.002_v3.pt. lr 0.002 chosen on val (LR check, 23 Oct).
# Reported runs: seeds 42/43/44, 64 px. data_root is the team Drive folder in Colab; change it for another machine.
# W&B key comes from Colab Secrets (WANDB_API_KEY), never from this file.
run:
  name: cls-full
  tags:
  - cls-full
  - track1
  - phase1
  wandb_project: ai251p-capstone
  wandb_entity: null
seeds:
- 42
- 43
- 44
data:
  data_root: /content/drive/MyDrive/AI251P_Capstone_CrossDomainAerial
  crops_dir: 01_Data/Processed/Crops
  crops_version: latest
  img_sizes:
  - 64
  balance_power: 0.5
  gpu_aug: true
  num_workers: 2
model:
  name: resnet18
  weights: IMAGENET1K_V1
  mode: full
  dropout: 0.2
train:
  epochs: 25
  batch_size: 256
  lr: 0.002
  backbone_lr_factor: 0.1
  weight_decay: 0.0001
  warmup_epochs: 1
  early_stop_patience: 6
  label_smoothing: 0.05
  class_loss_boost:
    truck: 1.0
    bus: 1.0
  amp: true
  select_metric: val_macro_f1
  resume: true
logit_adjust:
  enabled: true
  grid:
  - -2.0
  - 2.0
  - 0.1
  passes: 3
sanity:
  overfit_batch: 64
  overfit_steps: 300
output:
  dir: 02_Classification
